# =============================================================================
# FASE 4 — Stack de observabilidade (Prometheus + Loki + Grafana) via ArgoCD
# Aplicar com: kubectl apply -n argocd -f gitops/monitoring/applications-monitoring.yaml
# Os charts vêm de repositórios Helm públicos — não precisa registrar repo no ArgoCD.
# releaseName fixo => nomes de Service previsíveis:
#   prometheus-stack-kube-prom-prometheus:9090 | loki-stack:3100 | grafana:80
# OTel Collector e self-healer ficam em applications-monitoring-extras.yaml
# (dependem do Secret da New Relic e da imagem do self-healer no ECR).
# =============================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-prometheus
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack    # Prometheus + Alertmanager + kube-state-metrics + node-exporter
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.16.1
    helm:
      releaseName: prometheus-stack
      values: |
        grafana:
          enabled: false            # Grafana separado (app monitoring-grafana)
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 3d
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # CRDs do Prometheus Operator excedem o limite do apply client-side
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki-stack               # Loki (logs centralizados) + Promtail (coleta dos pods)
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 2.10.3
    helm:
      releaseName: loki-stack
      values: |
        loki:
          enabled: true
          isDefault: false
        promtail:
          enabled: true
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-grafana
  namespace: argocd
spec:
  project: default
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 10.5.15
    helm:
      releaseName: grafana
      values: |
        # Admin vem de um Secret criado manualmente (nada de senha no Git):
        #   kubectl -n monitoring create secret generic grafana-admin \
        #     --from-literal=admin-user=admin --from-literal=admin-password='<SENHA_FORTE>'
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: Prometheus
                type: prometheus
                url: http://prometheus-stack-kube-prom-prometheus.monitoring:9090
                isDefault: true
              - name: Loki
                uid: Loki
                type: loki
                url: http://loki-stack.monitoring:3100
        # ---------------------------------------------------------------------
        # Alerting como código: regra, contact point e policy são recriados
        # a cada restart do pod (Grafana sem PVC perdia o que foi feito na UI).
        # Chaves sensíveis vêm do Secret grafana-alerting (fora do Git):
        #   PAGERDUTY_INTEGRATION_KEY e DISCORD_WEBHOOK_URL
        # ---------------------------------------------------------------------
        envFromSecrets:
          - name: grafana-alerting
        alerting:
          contactpoints.yaml:
            apiVersion: 1
            contactPoints:
              - orgId: 1
                name: togglemaster-critico
                receivers:
                  - uid: tm-pagerduty
                    type: pagerduty
                    disableResolveMessage: false
                    settings:
                      integrationKey: $PAGERDUTY_INTEGRATION_KEY
                      severity: critical
                  - uid: tm-discord
                    type: discord
                    disableResolveMessage: false
                    settings:
                      url: $DISCORD_WEBHOOK_URL
                  - uid: tm-self-healer
                    type: webhook
                    disableResolveMessage: false
                    settings:
                      url: http://self-healer.monitoring.svc.cluster.local:8080/alert
                      httpMethod: POST
          policies.yaml:
            apiVersion: 1
            policies:
              - orgId: 1
                receiver: togglemaster-critico
                group_by: ['grafana_folder', 'alertname', 'namespace', 'deployment']
                group_wait: 10s
                group_interval: 30s
                repeat_interval: 4h
          rules.yaml:
            apiVersion: 1
            groups:
              - orgId: 1
                name: tc4
                folder: ToggleMaster
                interval: 30s
                rules:
                  - uid: tm-deploy-sem-replicas
                    title: ToggleMaster - Deployment sem réplicas disponíveis
                    condition: C
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: Prometheus
                        model:
                          refId: A
                          expr: min by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="togglemaster"})
                          instant: true
                          intervalMs: 1000
                          maxDataPoints: 43200
                      - refId: B
                        datasourceUid: __expr__
                        model:
                          refId: B
                          type: reduce
                          expression: A
                          reducer: last
                      - refId: C
                        datasourceUid: __expr__
                        model:
                          refId: C
                          type: threshold
                          expression: B
                          conditions:
                            - evaluator:
                                type: lt
                                params: [1]
                    noDataState: OK
                    execErrState: Error
                    for: 30s
                    labels:
                      severity: critical
                      service: togglemaster
                    annotations:
                      summary: Deployment do ToggleMaster sem réplicas disponíveis
                      description: kube_deployment_status_replicas_available abaixo de 1. Self-healer acionado via webhook.
        service:
          type: ClusterIP
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
