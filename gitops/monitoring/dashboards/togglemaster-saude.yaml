# =============================================================================
# Dashboard "ToggleMaster — Saúde do Ecossistema" (GUIA_FASE4 — seção 7)
# O sidecar do Grafana (grafana_dashboard) cria o dashboard automaticamente.
# Aplicar: kubectl apply -n monitoring -f gitops/monitoring/dashboards/togglemaster-saude.yaml
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-saude-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-saude.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "togglemaster"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "utc",
      "title": "ToggleMaster — Saúde do Ecossistema",
      "uid": "togglemaster-saude",
      "version": 1,
      "weekStart": "",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU — namespace togglemaster (por pod)",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 105,
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1,
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memória — uso vs limite do namespace (por pod)",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 106,
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1,
                "spanNulls": false,
                "min": 0
              },
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\"}) by (pod) / clamp_min(sum(kube_pod_container_resource_limits{namespace=\"togglemaster\", resource=\"memory\"}) by (pod), 1)",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requisições por microsserviço (req/s)",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 107,
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1,
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (service_name) (rate(http_server_request_duration_count[5m]))",
              "legendFormat": "{{service_name}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              }
            }
          ]
        },
        {
          "type": "logs",
          "title": "Logs em tempo real — namespace togglemaster",
          "datasource": "Loki",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 104,
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "showCommonLabels": false
          },
          "targets": [
            {
              "expr": "{namespace=\"togglemaster\"}",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              }
            }
          ]
        }
      ]
    }
